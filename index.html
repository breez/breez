<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breez recovery</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1a33; color: #fff; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { max-width: 480px; padding: 32px; text-align: center; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
  p { color: #b8c4d9; line-height: 1.5; margin: 0 0 16px; }
  a.button { display: inline-block; background: #0085fb; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; }
  code { background: #1c2b4d; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Signed in with Apple</h1>
  <p id="status">Returning you to the Breez recovery tool…</p>
  <p id="manual" hidden>If nothing happens, make sure the recovery tool is still running on this computer, then <a id="retry" class="button" href="#">return to the tool</a>.</p>
</main>
<script>
(function () {
  // Apple appends the session token to this URL after sign-in, as a query
  // parameter (URL redirect callback) or, in some flows, in the fragment.
  // This page hands it to the recovery tool listening on localhost. Nothing
  // is stored or sent anywhere else.
  var params = new URLSearchParams(location.search);
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  var token = params.get('ckWebAuthToken') || hash.get('ckWebAuthToken') || params.get('ckSession') || hash.get('ckSession');
  var status = document.getElementById('status');
  var manual = document.getElementById('manual');
  if (!token) {
    status.textContent = 'No sign-in token was received from Apple. Please close this tab and try again from the recovery tool.';
    return;
  }
  var target = 'http://127.0.0.1:53821/icloud?ckWebAuthToken=' + encodeURIComponent(token);
  document.getElementById('retry').href = target;
  manual.hidden = false;
  location.replace(target);
})();
</script>
</body>
</html>
